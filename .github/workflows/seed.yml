name: Experimental seed checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          # Packager controls read licenses/provenance from the declared seed SHA.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.11.0
          check-latest: false
      - name: Prepare pinned seed
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Prepare locked temporary seed dependencies
        run: cargo fetch --locked
      - name: Check readable formatting
        run: cargo fmt --all -- --check
      - name: Execute source tests offline
        run: cargo test --workspace --locked --offline
      - name: Check compiler warnings
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Build experimental compiler offline
        run: cargo build --workspace --locked --offline
      - name: Exercise actual CLI stack and source-input boundaries
        run: node scripts/test-compiler-boundaries.mjs
      - name: Check original-source editor diagnostics
        run: node scripts/test-check-json.mjs
      - name: Check experimental VS Code adapter with the actual compiler
        run: node scripts/test-vscode.mjs
      - name: Check project initialization and standalone compilation
        if: runner.os != 'Linux'
        run: node scripts/test-project-cli.mjs --compile-only
      - name: Execute initialized native project
        if: runner.os == 'Linux'
        run: node scripts/test-project-cli.mjs
      - name: Execute emitted Linux machine code
        if: runner.os == 'Linux'
        run: node scripts/test-native.mjs
      - name: Execute hosted native arithmetic and source programs
        if: runner.os == 'Linux'
        run: |
          node scripts/test-hosted.mjs
          node scripts/test-hosted-language.mjs
          node scripts/test-dynamic.mjs
          node scripts/test-functions.mjs
          node scripts/test-index.mjs
          node scripts/test-tuples.mjs
          node scripts/test-lists.mjs
          node scripts/test-files.mjs
          node scripts/test-objects.mjs
          node scripts/test-mappings.mjs
          node scripts/test-rationals.mjs --expect-source ${{ github.sha }}
          node scripts/test-intervals.mjs --expect-source ${{ github.sha }}
          node scripts/test-values-language.mjs
          node scripts/test-functions-language.mjs
          node scripts/test-index-language.mjs
          node scripts/test-tuples-language.mjs
          node scripts/test-lists-language.mjs
          node scripts/test-files-language.mjs --expect-source ${{ github.sha }}
          node scripts/test-objects-language.mjs --expect-source ${{ github.sha }}
          node scripts/test-mappings-language.mjs --expect-source ${{ github.sha }}
          node scripts/test-typed-literals-language.mjs --expect-source ${{ github.sha }}
          node scripts/test-rationals-language.mjs --expect-source ${{ github.sha }}
          node scripts/test-exact-literals-language.mjs --expect-source ${{ github.sha }}
          node scripts/test-intervals-language.mjs --expect-source ${{ github.sha }}
          node scripts/test-cli.mjs
      - name: Check bounded distribution packager controls
        run: node --test tests/distribution/package.test.mjs
      - name: Check planning and evidence integrity
        run: node scripts/validation/check-planning.mjs
      - name: Execute planning mutation tests
        run: node --test tests/planning/*.test.mjs
      - name: Check additive foundation contracts
        run: node scripts/validation/check-foundations.mjs
      - name: Check public continuity observation
        run: node scripts/validation/check-continuity.mjs
      - name: Execute contract mutation tests
        run: node --test tests/foundations/*.test.mjs
      - name: Exercise disposable recovery repositories
        run: node --test tests/continuity/*.test.mjs
      - name: Exercise evidence recorder source-mutation guards
        if: runner.os == 'Windows'
        run: node --test tests/evidence/*.test.mjs
